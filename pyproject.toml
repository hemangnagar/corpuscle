[project]
name = "corpuscle"
version = "0.0.1"
description = "Agentic corpus datasheet: signed, portable quality and compliance manifests that travel with a corpus"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
dependencies = [
  "cryptography>=42",
  "jsonschema>=4.20",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
spark = ["pyspark>=3.5"]
dev = ["pytest>=8"]

[project.scripts]
corpuscle = "corpuscle.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
corpuscle = ["../../schemas/*.json", "../../catalog/*.yaml"]
