# Default finding policy. What counts as a finding, not what to run.
#
# Which analyzers ran, and with which detector pins, is recorded in manifest.run.
# This file's id and version go in run.policy_version and its SHA-256 in run.pins,
# so every finding in a signed manifest can be regenerated from the same inputs.
#
# Fail is checked before flag. A metric the run did not report yields an
# inconclusive finding, never silence.
policy_id: corpuscle-default
policy_version: 0.1.0
framework: corpuscle-default
description: Baseline thresholds for a corpus intended for retrieval or training use.
evidence_limit: 50
rules:
  - rule_id: DUP-001
    clause: duplication.exact
    title: Exact duplicate rate
    metric_id: dup.exact_rate
    flag: {op: ">", value: 0.01}
    fail: {op: ">", value: 0.10}
    severity: {flag: low, fail: medium}
    evidence_flag: exact_duplicate
    rationale: Byte-identical copies inflate volume counts and are retrieved as one document many times.
  - rule_id: DUP-002
    clause: duplication.near
    title: Near-duplicate rate
    metric_id: dup.near_rate
    flag: {op: ">", value: 0.02}
    fail: {op: ">", value: 0.10}
    severity: {flag: medium, fail: high}
    evidence_flag: near_duplicate
    rationale: Near duplicates degrade retrieval diversity and over-weight their content in training; a model sees none of this about its own corpus.
  - rule_id: PROV-001
    clause: provenance.dated
    title: Undated document rate
    metric_id: prov.undated_rate
    flag: {op: ">", value: 0.10}
    fail: {op: ">", value: 0.50}
    severity: {flag: low, fail: medium}
    evidence_flag: undated
    rationale: A document with no collection date cannot be placed in time, aged out, or matched to a retention rule. A directory of files with no provenance is wholly undated, and that is a finding, not a default.
  - rule_id: PROV-002
    clause: provenance.identity
    title: Conflicting source identifiers
    metric_id: prov.duplicate_id_rate
    fail: {op: ">", value: 0}
    severity: {fail: high}
    evidence_flag: duplicate_source_id
    rationale: One source identifier over two different byte contents means the source, the transfer, or the adapter has mixed documents up. Inconclusive when no source supplies identifiers.
  - rule_id: INT-001
    clause: integrity.empty
    title: Empty document rate
    metric_id: int.empty_rate
    fail: {op: ">", value: 0}
    severity: {fail: medium}
    evidence_flag: empty
    rationale: A document with no extractable text is almost always a failed parse, and a failed parse is a document the corpus claims to contain and does not.
  - rule_id: INT-002
    clause: integrity.encoding
    title: Mojibake rate
    metric_id: int.mojibake_rate
    flag: {op: ">", value: 0}
    fail: {op: ">", value: 0.05}
    severity: {flag: low, fail: medium}
    evidence_flag: mojibake
    rationale: Encoding damage is silent to a model and corrupts every token it touches; it is also repairable, so it should be fixed at the source, not tolerated.
  - rule_id: INT-003
    clause: integrity.control
    title: Control-character rate
    metric_id: int.control_char_rate
    flag: {op: ">", value: 0}
    fail: {op: ">", value: 0.05}
    severity: {flag: low, fail: medium}
    evidence_flag: control_chars
    rationale: Control characters and replacement characters mean bytes were lost or misread between the source and the corpus.
  - rule_id: INT-004
    clause: integrity.near_empty
    title: Near-empty document rate
    metric_id: int.near_empty_rate
    flag: {op: ">", value: 0.05}
    fail: {op: ">", value: 0.20}
    severity: {flag: low, fail: medium}
    evidence_flag: near_empty
    rationale: Documents under twenty tokens carry almost no signal and inflate document counts.
  - rule_id: INT-005
    clause: integrity.truncation
    title: Truncation rate
    metric_id: int.truncation_rate
    flag: {op: ">", value: 0.10}
    fail: {op: ">", value: 0.30}
    severity: {flag: low, fail: medium}
    evidence_flag: truncated
    rationale: A document that stops mid-sentence was cut by an extractor, a size limit or a transfer; the missing tail is unknown.
  - rule_id: INT-006
    clause: integrity.markup
    title: Markup residue rate
    metric_id: int.markup_residue_rate
    flag: {op: ">", value: 0.05}
    fail: {op: ">", value: 0.25}
    severity: {flag: low, fail: medium}
    evidence_flag: markup_residue
    rationale: Tags and entities that survive parsing are noise a model will learn and a sign the adapter took the wrong extraction path.
  - rule_id: MARK-001
    clause: markings.conflict
    title: Banner and portion marks disagree
    metric_id: mark.conflict_rate
    fail: {op: ">", value: 0}
    severity: {fail: high}
    evidence_flag: marking_conflict
    rationale: A banner that understates its portions, or two banners at different levels, is a document whose handling cannot be trusted from its face.
  - rule_id: MARK-002
    clause: markings.ceiling
    title: Documents above the authorized ceiling
    metric_id: mark.ceiling_breach
    fail: {op: ">", value: 0}
    severity: {fail: critical}
    evidence_flag: ceiling_breach
    rationale: Content marked above what the corpus is authorized to hold is a spill. Inconclusive unless the run declares a ceiling.
  - rule_id: MARK-003
    clause: markings.redaction
    title: Redaction residue
    metric_id: mark.redaction_residue_rate
    flag: {op: ">", value: 0}
    fail: {op: ">", value: 0.05}
    severity: {flag: medium, fail: high}
    evidence_flag: redaction_residue
    rationale: A redaction placeholder or a pasted marking inside body text means a document was partially sanitized; what is around it was not reviewed as a whole.
