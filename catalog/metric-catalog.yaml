catalog_version: 0.1.0
note: 'Metric IDs are stable. A change to any method bumps method_version; the manifest records both. status: baseline = one
  of the 54 in the existing profiler; corrected = a baseline metric with a fixed method; added = new.'
detectors:
  glotlid:
    package: glotlid
    version: '3.0'
    role: language identification with confidence
  datasketch:
    package: datasketch
    version: 1.6.5
    role: MinHash near-duplicate detection
  textstat:
    package: textstat
    version: 0.7.4
    role: readability formulas and surface counts
  presidio:
    package: presidio-analyzer
    version: 2.2.358
    role: PII entity detection
    model: spacy/en_core_web_lg 3.8.0
  spacy:
    package: spacy
    version: 3.8.0
    model: en_core_web_lg 3.8.0
    role: NER entity density and salient terms; same model Presidio pins
  ftfy:
    package: ftfy
    version: 6.3.1
    role: mojibake detection
  tokenizer:
    package: tiktoken
    version: 0.9.0
    encoding: o200k_base
    role: token counting; per-model counts added per deployment
families:
- descriptive
- duplication
- language
- lexical
- readability
- integrity
- compliance
- provenance
- model_fit
- entities
metrics:
- id: vol.total_docs
  family: descriptive
  name: Total documents
  method: count of records
  method_version: 0.1.0
  level: corpus
  scope: all
  status: baseline
  unit: docs
- id: vol.total_tokens
  family: descriptive
  name: Total tokens
  method: sum of per-doc token counts
  method_version: 0.1.0
  level: corpus
  scope: all
  status: baseline
  unit: tokens
  detector: tokenizer
  note: v0 reports under a named tokenizer pin; per-model counts are the model-fit family.
- id: dup.exact_count
  family: duplication
  name: Exact duplicate count
  method: count of docs whose doc_hash repeats
  method_version: 0.1.0
  level: corpus
  scope: all
  status: baseline
  unit: docs
- id: dup.exact_rate
  family: duplication
  name: Exact duplicate rate
  method: dup.exact_count / vol.total_docs
  method_version: 0.1.0
  level: corpus
  scope: all
  status: baseline
  unit: fraction
- id: dup.near_count
  family: duplication
  name: Near-duplicate count
  method: MinHash LSH clusters, 128 perms, 5-word shingles, threshold configurable (default 0.8)
  method_version: 0.1.0
  level: corpus
  scope: all
  status: baseline
  unit: docs
  detector: datasketch
- id: dup.near_rate
  family: duplication
  name: Near-duplicate rate
  method: dup.near_count / vol.total_docs
  method_version: 0.1.0
  level: corpus
  scope: all
  status: baseline
  unit: fraction
  detector: datasketch
- id: lang.en.count
  family: language
  name: English document count
  method: GlotLID top label; unknown when confidence < threshold
  method_version: 0.1.0
  level: corpus
  scope: all
  status: baseline
  unit: docs
  detector: glotlid
- id: lang.en.rate
  family: language
  name: English document share
