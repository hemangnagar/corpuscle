- id: lex.ttr
  family: lexical
  name: Type-token ratio
  method: types / tokens per doc
  method_version: 0.1.0
  level: document
  scope: all
  status: baseline
  aggregations:
  - mean
  - var
  note: Kept for continuity; length-biased. See lex.mtld.
- id: lex.mtld
  family: lexical
  name: MTLD
  method: measure of textual lexical diversity, TTR threshold 0.72
  method_version: 0.1.0
  level: document
  scope: all
  status: corrected
  aggregations:
