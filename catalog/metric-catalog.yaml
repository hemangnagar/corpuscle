- id: lex.salient_terms
  family: lexical
  name: Most common salient terms
  method: top 50 lemmatized noun chunks by document frequency, stopwords removed, ties by total frequency
  method_version: 0.1.0
  level: corpus
  scope: all
  status: baseline
  unit: terms
  detector: spacy
  note: The one metric whose value is text. It is content, so it carries the corpus markings and a policy may suppress it.
- id: int.empty_count
  family: integrity
  name: Empty document count
  method: docs with zero extractable text after parsing
  method_version: 0.1.0
  level: corpus
  scope: all
  status: baseline
  unit: docs
  note: Distinct from int.near_empty_rate (under 20 tokens). Empty usually means a failed parse, not a short document.
- id: int.empty_rate
  family: integrity
  name: Empty document rate
  method: int.empty_count / vol.total_docs
  method_version: 0.1.0
  level: corpus
  scope: all
  status: baseline
  unit: fraction
- id: int.large_count
  family: integrity
  name: Large document count
  method: docs with size_bytes above the policy threshold (default 10 MiB)
  method_version: 0.1.0
  level: corpus
  scope: all
  status: baseline
  unit: docs
  note: Size in bytes at ingest. Token-based oversize is fit.over_chunk_rate.
- id: int.large_rate
  family: integrity
  name: Large document rate
  method: int.large_count / vol.total_docs
  method_version: 0.1.0
  level: corpus
  scope: all
  status: baseline
  unit: fraction
- id: prov.duplicate_id_count
  family: provenance
  name: Duplicate source id count
  method: docs whose source_id repeats within a source_system
  method_version: 0.1.0
  level: corpus
  scope: all
  status: baseline
  unit: docs
  note: Different content under one id is a source integrity problem; identical content is dup.exact_count. Undefined when source_id is absent.
- id: prov.duplicate_id_rate
  family: provenance
  name: Duplicate source id rate
  method: prov.duplicate_id_count / docs with a source_id
  method_version: 0.1.0
  level: corpus
  scope: all
  status: baseline
  unit: fraction
